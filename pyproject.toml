[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietify"
version = "0.1.0"
description = "Give foreign pronunciation a Vietnamese-style spelling."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "phonemizer>=3.4",
    "parsimonious>=0.11",
]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.4", "pillow>=10"]

[project.scripts]
vietify = "vietify.main:main"
vietify-gui = "vietify.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
